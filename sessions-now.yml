                        - generic [ref=f42e474]: "Based on the document, here is the information about mutual inductance:"
                        - generic [ref=f42e476]: Definition
                        - generic [ref=f42e478]: Mutual inductance is the property existing between two coils that are positioned so that the flux from one coil cuts the windings of the other coil [§3101]. Whenever two coils are located so that the flux from one coil links with the turns of the other coil, a change of flux in one coil causes an emf to be induced in the other coil [§2801].
                        - generic [ref=f42e480]: Factors That Affect Mutual Inductance
                        - generic [ref=f42e482]: "The mutual inductance between two coils depends upon the following factors [§2802]:"
                        - list [ref=f42e484]:
                          - listitem [ref=f42e485]:
                            - strong [ref=f42e486]: Physical dimensions of the two coils
                          - listitem [ref=f42e487]:
                            - strong [ref=f42e488]: Number of turns in each coil
                          - listitem [ref=f42e489]:
                            - strong [ref=f42e490]: Distance between the two coils
                          - listitem [ref=f42e491]:
                            - strong [ref=f42e492]: Relative positions of the axes of the two coils
                          - listitem [ref=f42e493]:
                            - strong [ref=f42e494]: Permeability of the cores
                        - generic [ref=f42e496]: "The amount of mutual inductance is also affected by the relative positions of the coils: if the coils are separated a considerable distance, the mutual inductance is low; conversely, if the coils are close together so that nearly all the flux of one coil links the turns of the other, the mutual inductance is high [§2801]."
                        - generic [ref=f42e498]: Coefficient of Coupling
                        - generic [ref=f42e500]:
                          - text: The mutual inductance between two coils is expressed in terms of their individual inductances and the
                          - strong [ref=f42e501]: coefficient of coupling (K)
                          - text: ", which represents the ratio of the flux cutting one coil to the flux originated in the other coil [§2802]."
