                    - generic [ref=f42e550]:
                      - generic [ref=f42e552]:
                        - generic [ref=f42e553]: "Based on the document, here are the safety precautions provided for working with capacitors:"
                        - generic [ref=f42e555]: Voltage Rating Safety
                        - generic [ref=f42e557]: When selecting a capacitor, you must ensure its working voltage is not exceeded [§3402]. If the voltage applied across a capacitor is too great, the dielectric will break down and arcing will occur between the capacitor plates, causing the capacitor to become a short-circuit and potentially damaging other electronic parts [§3402].
                        - generic [ref=f42e559]: "The working voltage depends on:"
                        - list [ref=f42e560]:
                          - listitem [ref=f42e561]: The type of material used as the dielectric
                          - listitem [ref=f42e562]: The thickness of the dielectric
                          - listitem [ref=f42e563]: The applied frequency [§3402]
                        - generic [ref=f42e565]: Safe Selection Practice
                        - generic [ref=f42e567]: In practice, a capacitor should be selected so that its working voltage is at least 50 percent greater than the highest effective voltage to be applied to it [§3402]. For example, if applying an alternating voltage of 500 volts (rms) which has a peak value of 707 volts, a capacitor should have a working voltage of at least 750 volts [§3402].
                        - generic [ref=f42e569]: Capacitor Discharge Hazard
                        - generic [ref=f42e571]: The document also mentions in its review questions that when working on electrical equipment with power secured and tagged, if a technician receives a shock, it may be because the technician had not discharged the equipment's capacitors [§11501]. This indicates that discharging capacitors is an important safety step before working on equipment.
