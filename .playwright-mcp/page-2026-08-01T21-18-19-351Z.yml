        - paragraph [ref=f17e46]: 1. **Paper Capacitors** - Construction and encasing methods, with variations ranging from tubular cardboard types to plastic-encased types for wider temperature ranges
        - paragraph [ref=f17e47]: 2. **Mica Capacitors** - Metal foil plates separated by sheets of mica as the dielectric, molded in plastic for corrosion protection and mechanical strength. Mica can withstand higher voltages than paper dielectrics, with common values ranging from approximately 50 picofarads to 0.02 microfarad
        - paragraph [ref=f17e48]: 3. **Ceramic Capacitors** - Containing ceramic dielectrics in either hollow cylinder or disk shapes, with values typically ranging from 1 picofarad to 0.01 microfarad and can be used with voltages as high as 30,000 volts
        - paragraph [ref=f17e49]: 4. **Electrolytic Capacitors** - Used where large capacitance is required, with detailed coverage of their construction, including the use of an aluminum container, oxide film dielectric, and electrolyte. The page discusses their polarization sensitivity, leakage resistance issues, and limitations to DC circuits or circuits with small AC voltage superimposed on DC voltage
