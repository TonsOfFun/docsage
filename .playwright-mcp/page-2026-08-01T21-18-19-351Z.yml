      - paragraph [ref=f17e17]: What is mutual inductance and what factors affect it?
    - generic [ref=f17e18]:
      - generic [ref=f17e19]: DocumentAgent
      - generic [ref=f17e20]:
        - paragraph [ref=f17e21]: "Based on the document, here is the information about mutual inductance:"
        - paragraph [ref=f17e22]: "## Definition"
        - paragraph [ref=f17e23]:
          - text: Mutual inductance is the property existing between two coils that are positioned so that the flux from one coil cuts the windings of the other coil [
          - link "§3101" [ref=f17e24] [cursor=pointer]:
            - /url: "#chunk-3101"
          - text: "]. Whenever two coils are located so that the flux from one coil links with the turns of the other coil, a change of flux in one coil causes an emf to be induced in the other coil ["
          - link "§2801" [ref=f17e25] [cursor=pointer]:
            - /url: "#chunk-2801"
          - text: "]."
        - paragraph [ref=f17e26]: "## Factors That Affect Mutual Inductance"
        - paragraph [ref=f17e27]:
          - text: The mutual inductance between two coils depends upon the following factors [
          - link "§2802" [ref=f17e28] [cursor=pointer]:
            - /url: "#chunk-2802"
          - text: "]:"
        - paragraph [ref=f17e29]: 1. **Physical dimensions of the two coils** 2. **Number of turns in each coil** 3. **Distance between the two coils** 4. **Relative positions of the axes of the two coils** 5. **Permeability of the cores**
        - paragraph [ref=f17e30]:
          - text: "The amount of mutual inductance is also affected by the relative positions of the coils: if the coils are separated a considerable distance, the mutual inductance is low; conversely, if the coils are close together so that nearly all the flux of one coil links the turns of the other, the mutual inductance is high ["
          - link "§2801" [ref=f17e31] [cursor=pointer]:
            - /url: "#chunk-2801"
          - text: "]."
        - paragraph [ref=f17e32]: "## Coefficient of Coupling"
        - paragraph [ref=f17e33]:
          - text: The mutual inductance between two coils is expressed in terms of their individual inductances and the **coefficient of coupling (K)**, which represents the ratio of the flux cutting one coil to the flux originated in the other coil [
          - link "§2802" [ref=f17e34] [cursor=pointer]:
            - /url: "#chunk-2802"
          - text: "]."
        - group [ref=f17e35]:
          - generic "generation · claude-haiku-4-5-20251001 · in:16,439 out:468 · end_turn" [ref=f17e36]
