anthropic: &anthropic
  service: "Anthropic"
  api_key: <%= ENV["ANTHROPIC_API_KEY"] %>
  model: "claude-haiku-4-5"

openai: &openai
  service: "OpenAI"
  api_key: <%= ENV["OPENAI_API_KEY"] %>
  model: "gpt-4o-mini"

# Traces post to the ActiveAgents dashboard (local docker compose in dev —
# see docs/demo.md). Leaving ACTIVEAGENTS_API_KEY unset disables telemetry.
telemetry: &telemetry
  enabled: <%= ENV["ACTIVEAGENTS_API_KEY"] ? true : false %>
  endpoint: <%= ENV.fetch("ACTIVEAGENTS_TELEMETRY_ENDPOINT", "https://api.activeagents.ai/v1/traces") %>
  api_key: <%= ENV["ACTIVEAGENTS_API_KEY"] %>
  service_name: docsage
  batch_size: 1
  flush_interval: 2

development:
  anthropic:
    <<: *anthropic
  openai:
    <<: *openai
  telemetry:
    <<: *telemetry

test:
  anthropic:
    service: "Mock"
  openai:
    service: "Mock"

production:
  anthropic:
    <<: *anthropic
  openai:
    <<: *openai
  telemetry:
    <<: *telemetry
